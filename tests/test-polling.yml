name: Test polling - test completes on first poll
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install jq so action apt-get step is a no-op
        run: |
          which jq && echo "jq already installed" || sudo apt-get install -y jq

      - name: Set up mock curl and sleep for polling scenario
        run: |
          mkdir -p /tmp/mock-bin
          echo "0" > /tmp/curl_call_count
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-curl-polling.sh" /tmp/mock-bin/curl
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-sleep.sh" /tmp/mock-bin/sleep
          chmod +x /tmp/mock-bin/curl /tmp/mock-bin/sleep
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - name: Verify mock is on PATH
        run: |
          echo "PATH: $PATH"
          which curl
          echo "curl is: $(which curl)"

      - id: action
        uses: .
        with:
          app_id: "fake-app-id"
          app_code: "fake-app-code"
          api_request: "https://endtest.io/api.php?action=runTests&appId=fake-app-id&appCode=fake-app-code&testSuiteId=99999"
          number_of_loops: "5"

      - name: Assert test_suite_name output after polling
        env:
          ACTUAL: ${{ steps.action.outputs.test_suite_name }}
        run: |
          echo "actual test_suite_name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: test_suite_name output is empty after polling"
            exit 1
          fi
          echo "PASS: test_suite_name is set to: $ACTUAL"

      - name: Assert hash output after polling
        env:
          ACTUAL: ${{ steps.action.outputs.hash }}
        run: |
          echo "actual hash: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: hash output is empty"
            exit 1
          fi
          echo "PASS: hash is set to: $ACTUAL"

      - name: Assert results URL after polling
        env:
          ACTUAL: ${{ steps.action.outputs.results }}
        run: |
          echo "actual results: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "endtest.io/results"; then
            echo "PASS: results URL is correct"
          else
            echo "FAIL: results URL does not contain 'endtest.io/results', got: $ACTUAL"
            exit 1
          fi

      - name: Assert start_time and end_time outputs
        env:
          START: ${{ steps.action.outputs.start_time }}
          END: ${{ steps.action.outputs.end_time }}
        run: |
          echo "actual start_time: $START"
          echo "actual end_time: $END"
          if [ -z "$START" ]; then
            echo "FAIL: start_time output is empty"
            exit 1
          fi
          if [ -z "$END" ]; then
            echo "FAIL: end_time output is empty"
            exit 1
          fi
          echo "PASS: start_time and end_time are set"

      - name: Assert detailed_logs output
        env:
          ACTUAL: ${{ steps.action.outputs.detailed_logs }}
        run: |
          echo "actual detailed_logs: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: detailed_logs output is empty"
            exit 1
          fi
          echo "PASS: detailed_logs is set to: $ACTUAL"
