name: Test fail_build with failures
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake curl
        run: |
          mkdir -p /tmp/fake-bin

          # Build a result with failures
          cat > /tmp/endtest-result.json <<'EOF'
          {
            "test_suite_name": "Failing Suite",
            "configuration": "Chrome on Windows",
            "test_cases": "3",
            "passed": "2",
            "failed": "3",
            "errors": "1",
            "start_time": "2024-01-01 10:00:00",
            "end_time": "2024-01-01 10:05:00",
            "detailed_logs": [],
            "screenshots_and_video": [],
            "test_case_management": [
              {"name": "TC1", "status": "passed"},
              {"name": "TC2", "status": "failed"},
              {"name": "TC3", "status": "error"}
            ]
          }
          EOF

          cat > /tmp/fake-bin/curl <<'CURLEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done

          emit() {
            if [ -n "$out" ]; then
              cat "$1" > "$out"
            else
              cat "$1"
            fi
          }

          case "$*" in
            *trigger-fail*)
              printf 'failhash' > /tmp/trigger-response.txt
              emit /tmp/trigger-response.txt
              exit 0
              ;;
            *getResults*)
              emit /tmp/endtest-result.json
              exit 0
              ;;
          esac

          exec /usr/bin/curl "$@"
          CURLEOF

          chmod +x /tmp/fake-bin/curl

      - name: Run action with fail_build=true and expect failure
        id: action
        uses: .
        continue-on-error: true
        env:
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          ENDTEST_POLL_INTERVAL_SECONDS: "0"
        with:
          app_id: "test-app-id"
          app_code: "test-app-code"
          api_request: "https://app.endtest.io/trigger-fail?appId=test-app-id&appCode=test-app-code"
          number_of_loops: "5"
          results_format: "json"
          fail_build: "true"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail_build=true and there are failures, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to test failures"
