name: Test jq installation step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app_id: "test-app-id"
          app_code: "test-app-code"
          api_request: "https://endtest.io/api.php?action=runTests&appId=test-app-id&appCode=test-app-code&testSuiteId=0"
          number_of_loops: "1"
      - name: Assert jq is installed after action runs
        run: |
          if ! command -v jq &>/dev/null; then
            echo "FAIL: jq is not available after action ran"
            exit 1
          fi
          echo "PASS: jq is installed"
          jq --version
