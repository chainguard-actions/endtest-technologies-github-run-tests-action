name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install jq
        run: |
          apt-get install -y jq 2>/dev/null || sudo apt-get install -y jq 2>/dev/null || true
          echo "jq: $(command -v jq || echo 'not found')"
      - id: action
        uses: .
        continue-on-error: true
        with:
          app_id: "test-app-id"
          app_code: "test-app-code"
          api_request: "https://endtest.io/api.php?action=runTests&appId=test-app-id&appCode=test-app-code&testSuiteId=0"
          number_of_loops: "1"
      - name: Assert action ran (not skipped)
        run: |
          outcome="${{ steps.action.outcome }}"
          echo "Action outcome: $outcome"
          if [ "$outcome" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome: $outcome)"
