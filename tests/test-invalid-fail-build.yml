name: Test invalid fail_build input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid fail_build value and capture exit code
        id: action
        uses: .
        with:
          app_id: "fake-app-id"
          app_code: "fake-app-code"
          api_request: "https://example.com/fake-api"
          number_of_loops: "1"
          fail_build: "yes"
        continue-on-error: true

      - name: Assert action failed due to invalid fail_build
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail_build is not 'true' or 'false', but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when fail_build was invalid"
