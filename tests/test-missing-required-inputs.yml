name: Test missing required inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with missing required inputs and capture exit code
        id: action
        uses: .
        with:
          app_id: ""
          app_code: ""
          api_request: ""
          number_of_loops: "1"
        continue-on-error: true

      - name: Assert action failed due to missing inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required inputs are missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required inputs were missing"
