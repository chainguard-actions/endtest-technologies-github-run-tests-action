name: Test basic success scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure jq is available and install mocks
        run: |
          # Ensure jq is installed (it's pre-installed on ubuntu-latest, but make sure)
          jq --version || sudo apt-get update && sudo apt-get install -y jq

      - name: Install mock curl, sleep, and apt-get
        run: |
          # Mock apt-get in /usr/bin so sudo can find it (sudo uses secure PATH)
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/apt-get > /dev/null
          sudo chmod +x /usr/bin/apt-get
          # Also mock in /usr/local/bin for non-sudo calls
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/apt-get > /dev/null
          sudo chmod +x /usr/local/bin/apt-get

          # Override sleep to be instant
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/sleep > /dev/null
          sudo chmod +x /usr/local/bin/sleep

          # Write fake curl to /usr/local/bin so it's on PATH for composite action steps
          # Handles: curl -X GET --header "Accept: */*" URL
          # Supports both pipe form (stdout) and hardened form (-o FILE)
          cat > /tmp/fake-curl.sh << 'FAKECURL'
          #!/bin/bash
          out=""
          prev=""
          url=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            case "$arg" in
              http*) url="$arg" ;;
            esac
            prev="$arg"
          done
          if echo "$url" | grep -q "getResults"; then
            payload='{"test_suite_name":"My Test Suite","configuration":"Chrome on Windows 10","test_cases":5,"passed":5,"failed":0,"errors":0,"start_time":"2024-01-01 10:00:00","end_time":"2024-01-01 10:05:00","detailed_logs":"All tests passed","screenshots_and_video":"https://endtest.io/screenshots/abc123"}'
            if [ -n "$out" ]; then
              echo "$payload" > "$out"
            else
              echo "$payload"
            fi
          else
            if [ -n "$out" ]; then
              echo "abc123hash" > "$out"
            else
              echo "abc123hash"
            fi
          fi
          exit 0
          FAKECURL
          sudo cp /tmp/fake-curl.sh /usr/local/bin/curl
          sudo chmod +x /usr/local/bin/curl

          # Verify fake curl is installed
          which curl
          curl --version || true
          echo "Fake curl installed successfully"

      - id: action
        uses: .
        with:
          app_id: "test-app-id"
          app_code: "test-app-code"
          api_request: "https://endtest.io/api.php?action=runTests&appId=test-app-id&appCode=test-app-code&suiteId=123"
          number_of_loops: "1"

      - name: Assert test_suite_name output
        env:
          ACTUAL: ${{ steps.action.outputs.test_suite_name }}
        run: |
          echo "actual test_suite_name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: test_suite_name output is empty"
            exit 1
          fi
          echo "PASS: test_suite_name is set"

      - name: Assert passed output
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: passed output is empty"
            exit 1
          fi
          echo "PASS: passed is set"

      - name: Assert failed output
        env:
          ACTUAL: ${{ steps.action.outputs.failed }}
        run: |
          echo "actual failed: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: failed output is empty"
            exit 1
          fi
          echo "PASS: failed is set"

      - name: Assert errors output
        env:
          ACTUAL: ${{ steps.action.outputs.errors }}
        run: |
          echo "actual errors: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: errors output is empty"
            exit 1
          fi
          echo "PASS: errors is set"

      - name: Assert hash output
        env:
          ACTUAL: ${{ steps.action.outputs.hash }}
        run: |
          echo "actual hash: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: hash output is empty"
            exit 1
          fi
          echo "PASS: hash is set"

      - name: Assert results output contains endtest.io domain
        env:
          ACTUAL: ${{ steps.action.outputs.results }}
        run: |
          echo "actual results: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "endtest.io/results"; then
            echo "PASS: results URL contains expected domain"
          else
            echo "FAIL: results URL does not contain endtest.io/results, got: $ACTUAL"
            exit 1
          fi

      - name: Assert configuration output
        env:
          ACTUAL: ${{ steps.action.outputs.configuration }}
        run: |
          echo "actual configuration: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: configuration output is empty"
            exit 1
          fi
          echo "PASS: configuration is set"

      - name: Assert test_cases output
        env:
          ACTUAL: ${{ steps.action.outputs.test_cases }}
        run: |
          echo "actual test_cases: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: test_cases output is empty"
            exit 1
          fi
          echo "PASS: test_cases is set"

      - name: Assert start_time output
        env:
          ACTUAL: ${{ steps.action.outputs.start_time }}
        run: |
          echo "actual start_time: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: start_time output is empty"
            exit 1
          fi
          echo "PASS: start_time is set"

      - name: Assert end_time output
        env:
          ACTUAL: ${{ steps.action.outputs.end_time }}
        run: |
          echo "actual end_time: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: end_time output is empty"
            exit 1
          fi
          echo "PASS: end_time is set"

      - name: Assert detailed_logs output
        env:
          ACTUAL: ${{ steps.action.outputs.detailed_logs }}
        run: |
          echo "actual detailed_logs: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: detailed_logs output is empty"
            exit 1
          fi
          echo "PASS: detailed_logs is set"

      - name: Assert screenshots_and_video output
        env:
          ACTUAL: ${{ steps.action.outputs.screenshots_and_video }}
        run: |
          echo "actual screenshots_and_video: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: screenshots_and_video output is empty"
            exit 1
          fi
          echo "PASS: screenshots_and_video is set"
